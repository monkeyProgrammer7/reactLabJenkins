services:
  jenkins:
    build: .
    image: jenkins-node:lts
    container_name: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    environment:
      - JAVA_OPTS=-Xmx2048m -Xms512m
    restart: unless-stopped

  frontend:
    build: ../frontend
    container_name: frontend
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    restart: unless-stopped
  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    # Expone Jenkins a internet (para los webhooks de GitHub)
    command: http jenkins:8080
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040" # Panel de ngrok con la URL pública y las peticiones
    depends_on:
      - jenkins
    restart: unless-stopped
volumes:
  jenkins_home:
