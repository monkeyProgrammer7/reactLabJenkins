# Configuración del análisis de SonarQube (la lee sonar-scanner automáticamente)
# La URL del servidor y el token los inyecta Jenkins con withSonarQubeEnv

# Identificador único del proyecto en SonarQube (si cambia, se crea un proyecto nuevo)
sonar.projectKey=telemetria-frontend
# Nombre visible en SonarQube ("Telemetría Frontend"; í es la í)
sonar.projectName=Telemetría Frontend
sonar.sourceEncoding=UTF-8

# Código de la aplicación a analizar
sonar.sources=src
# Las pruebas también están en src/, por eso se excluyen de sources para no indexarlas dos veces
sonar.exclusions=**/*.test.js,**/*.test.jsx,src/test/**

# Pruebas: se analizan aparte y no cuentan como código a cubrir
sonar.tests=src
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,src/test/**

# Reporte de cobertura generado por `npm run test:coverage`
sonar.javascript.lcov.reportPaths=coverage/lcov.info
